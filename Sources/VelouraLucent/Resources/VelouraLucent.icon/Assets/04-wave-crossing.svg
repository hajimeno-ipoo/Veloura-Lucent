<!-- soft shadow makes the front ribbon sit above the rear one -->
<path d="M70 772C246 825 420 756 550 621C681 485 751 310 937 207C888 290 808 427 716 550C603 700 455 818 296 856C208 877 122 851 82 829C61 817 55 789 70 772Z" transform="translate(0 12)" fill="#7563B6" fill-opacity="0.16"/>

